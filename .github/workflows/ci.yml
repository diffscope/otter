# Builds and tests otter on Linux, Windows and macOS.
#
# The dependency tree comes from vcpkg through the manifest in scripts/vcpkg-manifest, with the
# in-repo ports in scripts/vcpkg-ports searched before the shared overlay submodule.
#
# The macOS job builds Apple Silicon only, and cannot cover Intel macOS: the onnxruntime-builds port
# refuses a triplet other than arm64 on Darwin (scripts/vcpkg/ports/onnxruntime-builds/
# portfile.cmake), because upstream publishes no x64 macOS payload to deploy. A runner label is
# therefore used whose image is arm64, since an x64 image would leave the default triplet at
# x64-osx and fail the install.
name: ci

on:
  push:
    # The 2.4 line is the only one that commits here right now, so the trigger names it instead of
    # the trunk and the integration branches the workflow used to cover. A line added later needs
    # its own entry: a branch absent from this list is never built.
    #
    # pull_request is deliberately absent, which leaves the jobs unattached to a pull request that
    # opens from this line later. Add it back when a review needs the checks on the request itself.
    branches: ["spec2.4-**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
          # An arm64 image: the arm64-osx triplet and the arm64 payload of ONNX Runtime go with it.
          - os: macos-15
            triplet: arm64-osx
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          # The build generates the model fixtures if a Python interpreter with onnx is present.
          python3 -m pip install --user --break-system-packages onnx numpy

      - name: Install the Python build tools
        if: runner.os == 'Windows'
        # The build generates the model fixtures if a Python interpreter with onnx is present, and
        # the script tests read the declarations. Both jobs therefore need the same packages, and
        # the step also proves the interpreter the test suite looks for is the one on the path.
        run: |
          python -m pip install onnx numpy
          python --version

      - name: Install the Python build tools on macOS
        if: runner.os == 'MacOS'
        # macOS belongs in this list because the model tests do: without onnx the four of them are
        # registered as disabled while ctest still reports the run as green, which is the shrinkage
        # the "Require the model tests" step below exists to catch. Installing here fails in seconds
        # instead of after a full build.
        #
        # The interpreter is chosen, not taken from the path. This image ships Python 3.11 through
        # 3.14 with `python3` on 3.14, and onnx publishes no macOS wheel for a plain 3.14: its macOS
        # wheels are 3.10, 3.11 and the 3.12 stable ABI, plus a free-threaded 3.14 that a release
        # interpreter will not accept.
        #
        # The candidates are tried in order, each with the `--break-system-packages` the Linux step
        # already uses for the same reason — this image's interpreters are externally managed — and
        # each failure prints the interpreter and pip's own complaint, so a log is enough to see
        # which one worked and why the others did not. The first candidate to import onnx wins.
        #
        # PYTHON is exported so the Configure step hands CMake this same interpreter: an interpreter
        # without onnx disables the model tests instead of failing them, so installing into one while
        # CMake probes another would shrink the suite just as silently as not installing at all.
        run: |
          PYTHON=""
          for candidate in python3.13 python3.12 python3.11; do
            path="$(command -v "$candidate" || true)"
            if [ -z "$path" ]; then
              echo "$candidate: not on this image"
              continue
            fi
            echo "== trying $candidate at $path =="
            "$path" --version
            if ! "$path" -m pip install --user --break-system-packages onnx numpy; then
              echo "$candidate: pip failed, see its output above"
              continue
            fi
            if ! "$path" -c "import onnx, numpy; print('ok onnx', onnx.__version__)"; then
              echo "$candidate: installed but does not import onnx"
              continue
            fi
            PYTHON="$(command -v "$candidate")"
            break
          done
          if [ -z "$PYTHON" ]; then
            echo "::error::no interpreter on this image could import onnx"
            exit 1
          fi
          "$PYTHON" --version
          "$PYTHON" -c "import onnx, numpy; print('using onnx', onnx.__version__, 'numpy', numpy.__version__)"
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 1fddddc280dfed63956e15ef74f4321bc6a219c9
          runVcpkgInstall: false

      - name: Install dependencies
        shell: bash
        run: |
          "${{ runner.temp }}/vcpkg/vcpkg" install \
            --x-manifest-root=scripts/vcpkg-manifest \
            --x-install-root=build/vcpkg_installed \
            --x-feature=onnx --x-feature=tests

      - name: Generate the test packages
        # The packages the loading and runtime tests read are data, not sources: the generator holds
        # their contents, and the check proves the prepared directory matches it before any test
        # reads it. Without this step the two tests would report themselves as skipped and the suite
        # would shrink without failing.
        shell: bash
        run: |
          cmake -DOTTER_TEST_PACKAGES_OUTPUT="$PWD/build/test-packages" \
                -P scripts/make-test-packages.cmake
          cmake -DOTTER_TEST_PACKAGES_CHECK="$PWD/build/test-packages" \
                -P scripts/make-test-packages.cmake

      - name: Configure
        shell: bash
        run: |
          # The fixture generation and the script tests need the interpreter the packages were
          # installed into. The probe in CMake could find another one, and an interpreter without
          # onnx disables the four model tests instead of failing them, so the interpreter is named
          # here rather than left to the probe. The macOS job exports the one it installed into and
          # this takes it; the other jobs have a single interpreter and fall back to the path.
          PYTHON="${PYTHON:-$(command -v python3 || command -v python)}"
          cmake -S . -B build/cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DPython3_EXECUTABLE="$PYTHON" \
            -DOTTER_BUILD_TESTS=ON \
            -DOTTER_TEST_PACKAGES_SOURCE="$PWD/build/test-packages"

      - name: Build
        run: cmake --build build/cmake

      - name: Require the model tests
        # An interpreter without onnx disables the four model tests rather than failing them, and
        # ctest then passes while none of them ran. They are required here, because a suite that
        # shrinks without a word is worse than one that fails.
        shell: bash
        run: |
          listed="$(ctest --test-dir build/cmake -N)"
          for test in test_Rmvpe test_Game test_Hfa test_Tifa; do
            echo "$listed" | grep -qE "^[[:space:]]*Test +#[0-9]+: ${test}\$" || {
              echo "::error::${test} is not an enabled test, so an interpreter without onnx was found"
              exit 1
            }
          done

      - name: Test
        # Data-dependent tests exit with the skip status when the data they need is absent, which is
        # why the model fixtures are generated and the test packages are prepared above. The script
        # tests run here too: ctest carries them as test_CheckDeclarations, so running them again
        # from this file would only report the same verdict twice.
        run: ctest --test-dir build/cmake --output-on-failure

      - name: Check the installed CMake package
        # The test suite exercises the code, and this step exercises the installed package that a
        # host consumes. The install rules write its targets, include directories and plugin
        # directory, and only a consumer project reads them.
        shell: bash
        run: |
          cmake --install build/cmake --prefix build/install
          cmake -S .github/consumer -B build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer
